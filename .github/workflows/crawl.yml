name: Crawl and publish

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.yml
      - crawler/**
      - docs/**
      - .github/workflows/crawl.yml

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python crawler/crawl.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # generated_at changes every run, so compare the apps only.
          if git diff --quiet -I '"generated_at"' -- docs/catalog.json; then
            echo "catalog unchanged"
            git checkout -- docs/catalog.json
            exit 0
          fi
          git add docs/catalog.json
          git commit -m "chore(catalog): update app catalog"
          # main may have moved during the crawl; keep this run's catalog on top of it.
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
